schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  OpenSpec git behavior: Use the default branch-neutral OpenSpec flow. Do not
  create, switch, merge, rename, or delete git branches for OpenSpec changes
  unless the user explicitly asks for branch management.
  Repository scope: every OpenSpec git action applies to this repository only.
  This repo is consumed as a submodule of the Unchirp superproject; never
  `git add`/`commit`/`push` in that or any other enclosing repository, and never
  update its gitlink as part of an OpenSpec step. See openspec/GIT_WORKFLOW.md.
  Archive finalization (MANDATORY): after an archive move, commit and push the
  archive result on the current branch:
  - `git add -A`
  - `git commit -m "openspec(<name>): archive change"`
  - `git push`
  If the working tree also holds unrelated edits, stage the change work by path
  rather than `git add -A`.


