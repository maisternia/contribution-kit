[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contribution-kit"
version = "0.2.0"
description = "Reusable toolkit for attributing a modeled quantity to its contributing factors"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
	"pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
	"coverage>=7.6",
	"pytest>=8.3",
	"pytest-cov>=5.0",
]

[project.scripts]
contrib = "contribution.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/unit"]

[tool.coverage.run]
branch = true
source = ["contribution"]

[tool.coverage.report]
fail_under = 100
show_missing = true
